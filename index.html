<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンテナンスのお知らせ | 株式会社SINGULIER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 640px;
            width: 100%;
            text-align: center;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 32px;
        }

        .company-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #6e6e73;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .message {
            font-size: 16px;
            line-height: 2;
            color: #424245;
            margin-bottom: 40px;
        }

        .notice {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 24px 28px;
            font-size: 16px;
            line-height: 1.8;
            color: #6e6e73;
            text-align: left;
        }

        .notice-label {
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 8px;
        }

        .footer {
            margin-top: 48px;
            font-size: 16px;
            color: #6e6e73;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚙️</div>
        <div class="company-name">株式会社SINGULIER</div>

        <h1>ただいまサーバーメンテナンス中です</h1>

        <div class="message">
            現在、弊社が利用しているサーバー会社側の都合により、<br>
            本サイトへのアクセスができない状態となっております。<br>
            弊社のシステムに起因する障害ではございません。
        </div>

        <div class="notice">
            <div class="notice-label">復旧について</div>
            サーバー会社側の復旧作業が完了次第、<br>
            本サイトは通常どおりご利用いただけるようになります。<br>
            ご不便をおかけいたしますが、今しばらくお待ちください。
        </div>

        <div class="footer">株式会社SINGULIER</div>
    </div>
</body>
</html>
